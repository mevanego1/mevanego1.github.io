# ─────────────────────────────────────────────
#  Your site settings — edit these first
# ─────────────────────────────────────────────
title: "Matthew Evanego's Little Library"
author: "Matthew Evanego"
description: "A collection of short fiction."
tagline: "Short fiction, collected in one quiet place."

# The story shown in the big banner at the top of the home page.
# Use the story's title exactly as it appears in its file. Leave empty ("") to hide the banner.
featured: "Disturbed Frequency"

# Author sidebar on the home page
sidebar:
  bio: "I write short horror stories and share them online. Pull up a chair, keep the lights on, and pick something to read."
  reddit: "ThatScoobGuy"        # your Reddit username, without u/

# Your book, shown in the sidebar. To show a cover image, save it as
# assets/img/shadoweaver.jpg and set cover: "/assets/img/shadoweaver.jpg"
book:
  title: "Shadoweaver"
  kind: "A fantasy novel"
  url: "https://www.amazon.com/dp/B0DJNCML1L"
  cover: "/assets/img/shadoweaver.jpg"

# If your repository is named  yourusername.github.io  leave baseurl empty.
# If it's named something else (e.g. "stories"), set baseurl: "/stories"
url: "https://mevanego1.github.io"
baseurl: ""

# Words read per minute (used for the "x min read" estimate)
reading_speed: 230

# ─────────────────────────────────────────────
#  You shouldn't need to change anything below
# ─────────────────────────────────────────────
markdown: kramdown
kramdown:
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]

collections:
  stories:
    output: true
    permalink: /stories/:name/

# Image shown when a link to the site is shared (Reddit, Discord, texts…)
share_image: /assets/img/share.jpg
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/share.jpg
  - scope:
      path: ""
      type: stories
    values:
      layout: story

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  collections:
    - stories

exclude:
  - README.md
  - STORY_TEMPLATE.md
  - Gemfile
  - Gemfile.lock
